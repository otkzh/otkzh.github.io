<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>GPS Map Capture v3</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Tailwind CSS for Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #0f172a;
      }
      #map {
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      .leaflet-control-zoom {
        display: none !important;
      }
      .leaflet-attribution-control {
        font-size: 8px !important;
        background: rgba(15, 23, 42, 0.5) !important;
        color: #ccc !important;
      }
      /* 手書きキャンバス */
      #drawing-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 15;
        cursor: crosshair;
        pointer-events: none;
      }
      #drawing-canvas.active {
        pointer-events: auto;
      }
      .target-center {
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
      }
      #text-memo::placeholder {
        color: rgba(148, 163, 184, 0.4);
      }
    </style>
  </head>
  <body class="flex flex-col text-white font-sans select-none overflow-hidden">
    <!-- メインマップエリア (キャプチャ対象) -->
    <main class="relative flex-1 bg-slate-800" id="capture-area">
      <!-- 上部：情報・メモ・レイヤー切替パネル -->
      <div
        class="absolute top-0 left-0 right-0 z-20 p-3 bg-slate-900/85 backdrop-blur-md border-b border-slate-700/50 pointer-events-none"
      >
        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-start gap-3">
            <div class="flex-1 space-y-1">
              <p
                class="text-[9px] text-slate-500 font-bold tracking-widest uppercase"
              >
                GPS Data & Memo
              </p>
              <div class="flex items-center gap-3">
                <div class="shrink-0 border-r border-slate-700 pr-3">
                  <div
                    class="text-xl font-mono font-black text-blue-400 leading-none"
                  >
                    <span class="text-[9px] text-slate-600 mr-1 font-sans"
                      >LAT</span
                    >
                    <span id="lat-display">0.000000</span>
                  </div>
                  <div
                    class="text-xl font-mono font-black text-emerald-400 leading-tight"
                  >
                    <span class="text-[9px] text-slate-600 mr-1 font-sans"
                      >LNG</span
                    >
                    <span id="lng-display">0.000000</span>
                  </div>
                </div>
                <div class="flex-1 pointer-events-auto">
                  <input
                    type="text"
                    id="text-memo"
                    placeholder="場所のメモ..."
                    class="w-full bg-slate-800/60 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500 transition-colors shadow-inner"
                  />
                </div>
              </div>
            </div>

            <div class="flex flex-col items-end gap-1">
              <div class="text-right shrink-0">
                <p class="text-[9px] text-slate-500 font-bold uppercase">
                  Zoom
                </p>
                <p
                  id="zoom-display"
                  class="text-lg font-mono font-bold text-slate-200 leading-none"
                >
                  15.0
                </p>
              </div>
              <!-- レイヤー切り替えボタン (単一) -->
              <button
                id="btn-layer-toggle"
                class="pointer-events-auto mt-1 flex items-center justify-center px-2 py-1.5 bg-slate-700 active:bg-slate-600 border border-slate-600 rounded-md text-[10px] font-bold shadow-sm transition-all text-blue-300"
              >
                <i data-lucide="layers" class="w-3 h-3 mr-1"></i>
                <span id="layer-label">OSM</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 地図本体 -->
      <div id="map"></div>

      <!-- 手書きキャンバス -->
      <canvas id="drawing-canvas"></canvas>

      <!-- 中心ターゲット -->
      <div
        class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center"
      >
        <div class="relative flex items-center justify-center">
          <div class="absolute w-14 h-[1px] bg-red-500"></div>
          <div class="absolute h-14 w-[1px] bg-red-500"></div>
          <div
            class="w-10 h-10 border-2 border-red-500 rounded-full opacity-60"
          ></div>
          <div
            class="w-1 h-1 bg-red-500 rounded-full absolute target-center"
          ></div>
        </div>
      </div>

      <!-- ローディング -->
      <div
        id="loader"
        class="absolute inset-0 z-40 bg-slate-900 flex flex-col items-center justify-center space-y-3"
      >
        <i
          data-lucide="refresh-cw"
          class="w-8 h-8 text-blue-500 animate-spin"
        ></i>
        <p
          class="text-xs font-medium animate-pulse text-slate-400 tracking-widest uppercase"
        >
          Fetching Location...
        </p>
      </div>
    </main>

    <!-- 下部コントロールパネル (6列構成) -->
    <footer
      class="z-20 p-3 pb-6 bg-slate-900 border-t border-slate-800 grid grid-cols-6 gap-2"
    >
      <button
        id="btn-zoom-in"
        class="flex flex-col items-center justify-center bg-slate-800 h-14 rounded-xl active:bg-blue-600 transition-colors border border-slate-700"
      >
        <i data-lucide="zoom-in" class="w-5 h-5 mb-1"></i>
        <span class="text-[7px] font-bold uppercase">In</span>
      </button>

      <button
        id="btn-zoom-out"
        class="flex flex-col items-center justify-center bg-slate-800 h-14 rounded-xl active:bg-blue-600 transition-colors border border-slate-700"
      >
        <i data-lucide="zoom-out" class="w-5 h-5 mb-1"></i>
        <span class="text-[7px] font-bold uppercase">Out</span>
      </button>

      <button
        id="btn-draw-toggle"
        class="flex flex-col items-center justify-center bg-slate-800 h-14 rounded-xl transition-all border border-slate-700"
      >
        <i data-lucide="pencil" id="draw-icon" class="w-5 h-5 mb-1"></i>
        <span class="text-[7px] font-bold uppercase" id="draw-label">Pen</span>
      </button>

      <button
        id="btn-clear"
        class="flex flex-col items-center justify-center bg-slate-800 h-14 rounded-xl active:bg-red-900 transition-colors border border-slate-700"
      >
        <i data-lucide="eraser" class="w-5 h-5 mb-1 text-red-400"></i>
        <span class="text-[7px] font-bold uppercase text-red-400">Clear</span>
      </button>

      <!-- 現在地取得ボタン (下部に追加) -->
      <button
        id="btn-gps"
        class="flex flex-col items-center justify-center bg-slate-700 h-14 rounded-xl active:bg-blue-500 transition-colors border border-slate-600"
      >
        <i data-lucide="crosshair" class="w-5 h-5 mb-1 text-blue-400"></i>
        <span class="text-[7px] font-bold uppercase text-blue-400 font-mono"
          >GPS</span
        >
      </button>

      <button
        id="btn-capture"
        class="flex flex-col items-center justify-center h-14 rounded-xl bg-blue-600 active:bg-blue-500 active:scale-95 transition-all shadow-lg shadow-blue-600/20 border border-blue-500"
      >
        <i data-lucide="camera" class="w-5 h-5 mb-1"></i>
        <span id="capture-text" class="text-[7px] font-bold uppercase"
          >Save</span
        >
      </button>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      let map
      const state = {
        lat: 35.6812,
        lng: 139.7671,
        isCapturing: false,
        isDrawingMode: false,
        currentLayer: 'osm',
      }

      const layers = {
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OSM',
          crossOrigin: true,
        }),
        gsi: L.tileLayer(
          'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
          {
            attribution: '&copy; GSI Japan',
            crossOrigin: true,
          }
        ),
      }

      const latDisplay = document.getElementById('lat-display')
      const lngDisplay = document.getElementById('lng-display')
      const zoomDisplay = document.getElementById('zoom-display')
      const loader = document.getElementById('loader')
      const captureArea = document.getElementById('capture-area')
      const captureText = document.getElementById('capture-text')
      const layerLabel = document.getElementById('layer-label')

      const canvas = document.getElementById('drawing-canvas')
      const ctx = canvas.getContext('2d')
      let isDrawing = false

      function initApp() {
        lucide.createIcons()
        setupDrawingCanvas()

        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => startMap(pos.coords.latitude, pos.coords.longitude),
            () => startMap(state.lat, state.lng),
            { enableHighAccuracy: true }
          )
        } else {
          startMap(state.lat, state.lng)
        }
      }

      function startMap(lat, lng) {
        map = L.map('map', {
          center: [lat, lng],
          zoom: 15,
          zoomSnap: 0.1,
          zoomDelta: 0.5,
          wheelPxPerZoomLevel: 120,
          fadeAnimation: false,
        })

        layers.osm.addTo(map)

        map.on('move', updateDisplay)
        map.on('zoomend', updateDisplay)

        updateDisplay()

        setTimeout(() => {
          loader.style.opacity = '0'
          setTimeout(() => (loader.style.display = 'none'), 500)
        }, 600)
      }

      function updateDisplay() {
        const center = map.getCenter()
        const currentZoom = map.getZoom()
        latDisplay.textContent = center.lat.toFixed(6)
        lngDisplay.textContent = center.lng.toFixed(6)
        zoomDisplay.textContent = currentZoom.toFixed(1)
      }

      // --- レイヤー切り替え (単一ボタンでトグル) ---
      document
        .getElementById('btn-layer-toggle')
        .addEventListener('click', () => {
          const next = state.currentLayer === 'osm' ? 'gsi' : 'osm'
          map.removeLayer(layers[state.currentLayer])
          layers[next].addTo(map)
          state.currentLayer = next
          layerLabel.textContent = next === 'osm' ? 'OSM' : '地理院'
        })

      // --- 手書き描画ロジック ---
      function setupDrawingCanvas() {
        const resize = () => {
          const rect = captureArea.getBoundingClientRect()
          const tempCanvas = document.createElement('canvas')
          tempCanvas.width = canvas.width
          tempCanvas.height = canvas.height
          if (canvas.width > 0 && canvas.height > 0) {
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0)
          }

          canvas.width = rect.width
          canvas.height = rect.height

          ctx.strokeStyle = '#ef4444'
          ctx.lineWidth = 3
          ctx.lineJoin = 'round'
          ctx.lineCap = 'round'
          ctx.drawImage(tempCanvas, 0, 0)
        }

        window.addEventListener('resize', resize)
        resize()

        const getPos = (e) => {
          const rect = canvas.getBoundingClientRect()
          const clientX = e.touches ? e.touches[0].clientX : e.clientX
          const clientY = e.touches ? e.touches[0].clientY : e.clientY
          return { x: clientX - rect.left, y: clientY - rect.top }
        }

        const start = (e) => {
          if (!state.isDrawingMode) return
          isDrawing = true
          const pos = getPos(e)
          ctx.beginPath()
          ctx.moveTo(pos.x, pos.y)
        }

        const move = (e) => {
          if (!isDrawing) return
          const pos = getPos(e)
          ctx.lineTo(pos.x, pos.y)
          ctx.stroke()
          e.preventDefault()
        }

        const end = () => {
          isDrawing = false
        }

        canvas.addEventListener('mousedown', start)
        canvas.addEventListener('mousemove', move)
        window.addEventListener('mouseup', end)
        canvas.addEventListener('touchstart', start, { passive: false })
        canvas.addEventListener('touchmove', move, { passive: false })
        canvas.addEventListener('touchend', end)
      }

      // --- 下部コントロール ---
      document
        .getElementById('btn-zoom-in')
        .addEventListener('click', () => map.setZoom(map.getZoom() + 0.2))
      document
        .getElementById('btn-zoom-out')
        .addEventListener('click', () => map.setZoom(map.getZoom() - 0.2))

      const drawBtn = document.getElementById('btn-draw-toggle')
      const drawLabel = document.getElementById('draw-label')
      drawBtn.addEventListener('click', () => {
        state.isDrawingMode = !state.isDrawingMode
        if (state.isDrawingMode) {
          canvas.classList.add('active')
          drawBtn.classList.replace('bg-slate-800', 'bg-blue-600')
          drawLabel.textContent = 'Active'
        } else {
          canvas.classList.remove('active')
          drawBtn.classList.replace('bg-blue-600', 'bg-slate-800')
          drawLabel.textContent = 'Pen'
        }
      })

      document.getElementById('btn-clear').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height)
      })

      // 現在地取得ボタン
      document.getElementById('btn-gps').addEventListener('click', () => {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            map.setView(
              [pos.coords.latitude, pos.coords.longitude],
              map.getZoom()
            )
          },
          (err) => {
            console.error('GPS Error', err)
          },
          { enableHighAccuracy: true }
        )
      })

      document
        .getElementById('btn-capture')
        .addEventListener('click', async () => {
          if (state.isCapturing) return
          state.isCapturing = true
          captureText.textContent = '...'

          try {
            const resultCanvas = await html2canvas(captureArea, {
              useCORS: true,
              scale: 2,
              backgroundColor: '#0f172a',
            })

            const link = document.createElement('a')
            link.download = `loc_${state.currentLayer}_${Math.floor(
              Date.now() / 1000
            )}.png`
            link.href = resultCanvas.toDataURL('image/png')
            link.click()
          } catch (err) {
            console.error('Capture error:', err)
          } finally {
            state.isCapturing = false
            captureText.textContent = 'Save'
          }
        })

      window.onload = initApp
    </script>
  </body>
</html>

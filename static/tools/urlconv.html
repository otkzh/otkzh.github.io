<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLドメイン置換ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
        }
        .container-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl container-shadow">
        <div class="flex items-center gap-3 mb-6 border-b pb-4">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">URLドメイン置換ツール</h1>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <!-- Settings Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Standard Domain Input -->
                <div class="p-4 border border-slate-200 rounded-xl bg-slate-50">
                    <label for="domainInput" class="block text-sm font-semibold text-slate-700 mb-2">
                        置換後のドメイン
                    </label>
                    <input 
                        type="text" 
                        id="domainInput" 
                        placeholder="example.com"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition mb-3"
                    >
                    <button 
                        onclick="convertUrls('standard')"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition flex items-center justify-center gap-2 text-sm"
                    >
                        ドメイン置換実行
                    </button>
                </div>

                <!-- Localhost Input -->
                <div class="p-4 border border-blue-100 rounded-xl bg-blue-50">
                    <label for="portInput" class="block text-sm font-semibold text-blue-800 mb-2">
                        Localhost ポート番号
                    </label>
                    <input 
                        type="number" 
                        id="portInput" 
                        placeholder="3000"
                        class="w-full px-4 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition mb-3"
                    >
                    <button 
                        onclick="convertUrls('localhost')"
                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-4 rounded-lg transition flex items-center justify-center gap-2 text-sm"
                    >
                        Localhost (http) に置換
                    </button>
                </div>
            </div>

            <!-- URL List Input -->
            <div>
                <label for="urlInput" class="block text-sm font-semibold text-slate-700 mb-2">
                    元のURLリスト (1行に1つずつ入力)
                </label>
                <textarea 
                    id="urlInput" 
                    rows="8" 
                    placeholder="https://example.com/page1&#10;https://api.test.jp/v1/users"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition custom-scrollbar font-mono text-sm"
                ></textarea>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="resultContainer" class="hidden animate-in fade-in duration-500">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold text-slate-700">
                        変換結果
                    </label>
                    <button 
                        id="copyButton"
                        onclick="copyToClipboard()"
                        class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1.5 px-4 rounded-lg transition flex items-center gap-1"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-3 8h3m-3 4h3m-6-4h.01M9 17h.01" />
                        </svg>
                        <span>コピー</span>
                    </button>
                </div>
                <div 
                    id="resultList" 
                    class="w-full p-4 border border-blue-100 bg-blue-50 rounded-xl min-h-[100px] overflow-x-auto"
                >
                    <!-- Clickable links will appear here -->
                </div>
                <div id="statusMsg" class="mt-2 text-xs text-blue-600 font-medium hidden">
                    コピーしました！
                </div>
            </div>
        </div>

        <footer class="mt-8 pt-6 border-t text-center text-slate-400 text-sm">
            URLドメイン置換ツール - クエリパラメータ ?d=example.com で初期値を設定可能
        </footer>
    </div>

    <!-- Hidden textarea for copying -->
    <textarea id="copyBuffer" class="fixed -top-full opacity-0"></textarea>

    <script>
        // Page Load Logic
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const domainParam = params.get('d');
            if (domainParam) {
                document.getElementById('domainInput').value = domainParam;
            }
        });

        function convertUrls(mode) {
            const domainInput = document.getElementById('domainInput').value.trim();
            const portInput = document.getElementById('portInput').value.trim();
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const resultList = document.getElementById('resultList');
            const copyBuffer = document.getElementById('copyBuffer');

            if (mode === 'standard' && !domainInput) {
                alert('置換後のドメインを入力してください。');
                return;
            }
            if (!urlInput) {
                alert('URLリストを入力してください。');
                return;
            }

            const urls = urlInput.split(/\n/);
            const convertedUrls = [];
            
            resultList.innerHTML = '';
            
            urls.forEach(rawUrl => {
                const trimmed = rawUrl.trim();
                if (!trimmed) return;

                try {
                    let url;
                    if (trimmed.match(/^https?:\/\//)) {
                        url = new URL(trimmed);
                    } else {
                        url = new URL('http://' + trimmed);
                    }

                    if (mode === 'localhost') {
                        // For localhost: Force http and set host:port
                        url.protocol = 'http:';
                        url.hostname = 'localhost';
                        url.port = portInput || '';
                    } else {
                        // For standard: Replace host only
                        let newDomain = domainInput.replace(/^(https?:\/\/)/, '').replace(/\/$/, '');
                        url.hostname = newDomain;
                    }
                    
                    const finalUrl = url.toString();
                    convertedUrls.push(finalUrl);

                    // Create UI element
                    const linkWrapper = document.createElement('div');
                    linkWrapper.className = 'mb-1 last:mb-0';
                    
                    const a = document.createElement('a');
                    a.href = finalUrl;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = 'text-blue-600 hover:text-blue-800 hover:underline break-all text-sm font-mono';
                    a.textContent = finalUrl;
                    
                    linkWrapper.appendChild(a);
                    resultList.appendChild(linkWrapper);
                } catch (e) {
                    const errorSpan = document.createElement('div');
                    errorSpan.className = 'text-red-500 text-xs italic mb-1';
                    errorSpan.textContent = `エラー: ${trimmed}`;
                    resultList.appendChild(errorSpan);
                }
            });

            copyBuffer.value = convertedUrls.join('\n');
            resultContainer.classList.remove('hidden');
        }

        function copyToClipboard() {
            const copyBuffer = document.getElementById('copyBuffer');
            const statusMsg = document.getElementById('statusMsg');
            copyBuffer.select();
            document.execCommand('copy');
            statusMsg.classList.remove('hidden');
            setTimeout(() => statusMsg.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
